name: ARGUS OS — Continuous Integration

on:
  push:
    branches:
      - main
      - batman
  pull_request:
    branches:
      - main
      - batman

jobs:
  validate-frontend:
    name: Lint, Test, and Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Validate Code Quality (Linter)
        run: npm run lint

      - name: Execute Unit Tests
        run: npm run test

      - name: Compile Frontend Bundle
        run: npm run build

  validate-tauri:
    name: Validate Tauri Backend Build
    runs-on: ubuntu-latest
    needs: validate-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tauri Ubuntu System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Setup
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Compile Tauri Application
        run: npm run tauri build -- --no-bundle
