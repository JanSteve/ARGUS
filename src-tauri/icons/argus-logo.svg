<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Core Iris Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a15" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  
  <!-- Subtle Grid Texture -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="16" y1="128" x2="496" y2="128" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="384" x2="496" y2="384" />
    <line x1="128" y1="16" x2="128" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="384" y1="16" x2="384" y2="496" />
  </g>

  <!-- Outer Energy Aura -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.3" filter="url(#ambientGlow)" />

  <!-- Outer Orbital Segment Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-dasharray="160 30 80 40 120 20" stroke-linecap="round" />
  
  <!-- Outer Satellite Nodes -->
  <circle cx="256" cy="106" r="6" fill="#00f5ff" filter="url(#coreGlow)" />
  <circle cx="406" cy="256" r="6" fill="#a855f7" filter="url(#coreGlow)" />
  <circle cx="256" cy="406" r="6" fill="#6366f1" filter="url(#coreGlow)" />
  <circle cx="106" cy="256" r="6" fill="#38bdf8" filter="url(#coreGlow)" />

  <!-- Secondary Concentric Shield Hexagon -->
  <polygon points="256,136 360,196 360,316 256,376 152,316 152,196" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2.5" stroke-dasharray="12 8" />

  <!-- Inner Cybernetic Reticle Ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="88" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />

  <!-- Reticle Crosshairs -->
  <line x1="256" y1="140" x2="256" y2="165" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="347" x2="256" y2="372" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
  <line x1="140" y1="256" x2="165" y2="256" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
  <line x1="347" y1="256" x2="372" y2="256" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />

  <!-- Central Sovereign Iris Core -->
  <circle cx="256" cy="256" r="70" fill="url(#irisGrad)" filter="url(#coreGlow)" />

  <!-- Central AI Neural Core Pulse -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" filter="url(#coreGlow)" opacity="0.95" />
  <circle cx="256" cy="256" r="18" fill="#38bdf8" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />

  <!-- Corner Tech Accents -->
  <path d="M48 96 L48 48 L96 48" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M464 96 L464 48 L416 48" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M48 416 L48 464 L96 464" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M464 416 L464 464 L416 464" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
