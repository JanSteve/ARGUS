[package]
name = "argus-linux"
version = "0.1.0"
edition = "2021"
authors = ["R Jan Steve Daniel"]
description = "ARGUS 2.0 Linux Desktop & System Integration Layer"

[dependencies]
argus-core = { path = "../argus-core" }
argus-sandbox = { path = "../argus-sandbox" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
