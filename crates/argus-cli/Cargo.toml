[package]
name = "argus-cli"
version = "0.1.0"
edition = "2021"
authors = ["R Jan Steve Daniel"]
description = "ARGUS 2.0 Interactive Voice/Chat Agent Executive CLI"

[dependencies]
argus-core = { path = "../argus-core" }
argus-sandbox = { path = "../argus-sandbox" }
argus-linux = { path = "../argus-linux" }
argus-agent = { path = "../argus-agent" }
argus-voice = { path = "../argus-voice" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
